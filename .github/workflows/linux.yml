name: CI in Linux
#Also updates documentation with branch gh-pages
on:
  push:
    branches-ignore:
    - gh-pages
  pull_request:
    branches-ignore:
    - gh-pages
  
jobs:
  build:
    if: github.repository == 'lianqiw/maos'
    runs-on: ubuntu-latest

    steps:
    - name: setup environment #install all external libraryes to avoid distcheck failure
      run: sudo apt-get install -y libfftw3-dev libsuitesparse-dev libcmocka-dev libopenblas-openmp-dev graphviz doxygen texlive-latex-base
      continue-on-error: true
    - name: install CUDA toolkit #Ubuntu bundled CUDA. GitHub hosted runners have no GPU. maos falls back to CPU.
      run: |
        sudo apt-get update
        sudo apt-get install -y nvidia-cuda-toolkit gcc-12 g++-12 #CUDA 12.0 supports gcc up to 12
        nvcc --version
    - name: checkout
      uses: actions/checkout@v6
      with:
        path: maos
    - name: autogen
      run: |
        cd maos && ./autogen.sh
    - name: configure and make
      run: |
        mkdir build && cd build
        ../maos/configure --enable-release --enable-werror --enable-doxygen --with-cuda=/usr --with-ccbin=gcc-12 --prefix=$(pwd)/../external
        grep -q "define USE_CUDA [1-9]" config.h || { echo "CUDA is not enabled"; exit 1; }
        make -j8
        make check
    - name: make doc
      run: cd build && make doc
    - name: checkout gh-pages 
      #if: github.ref == 'refs/heads/master'
      uses: actions/checkout@v6
      with:
        ref: gh-pages
        path: doc
    - name: update doc and commit
      #if: github.ref == 'refs/heads/master'
      run: | 
        cd doc
        rm -rf *
        cp -a ../build/doxygen-doc/html/* .
        find . -name \*.map -delete -o -name \*.md5 -delete
        git config user.name Lianqi Wang
        git config user.email lianqiw@gmail.com
        git add .
        git commit -m "Automatically updated" && git push || echo "no need to update doc"
    - name: clang make
      run: |
        mkdir clang && cd clang
        ../maos/configure --enable-release --enable-werror --prefix=$(pwd)/../external CC=clang --without-cuda
        make -j8
        make check
    - name: clang with undefined behavior sanitizer #not a release build, so that the scheduler is built and tested
      run: |
        mkdir ubsan && cd ubsan
        ../maos/configure --enable-werror --prefix=$(pwd)/../external CC=clang --without-cuda \
          CFLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=undefined"
        make -j8
        make check
        make -C test check-scheduler
    - name: maos result check
      run: cd build/bin && ../../maos/scripts/maos_check.sh 5
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: maos-linux
        retention-days: 30
        path: |
          */config.*
          build/test/*.log
          ubsan/test/*.log
          build/bin/maos_check_*.*
