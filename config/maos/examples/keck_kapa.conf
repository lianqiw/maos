#KECK KAPA LTAO Configuration
#base LTAO configuration
include = ltao.conf 
#Telescope aperture
include     = keck.conf

#The original DM
dm.dx       = [0.563] 
dm.iastroke	= [1.2]
dm.stroke	= [2.0]
sim.focus2tel=1

#Atmospheric profile
include     = atm_mk50pGL_50pFA.conf #Mauna Kea 13N 50%.  Updated 2026-07-31
atm.size    = [128 128] #to covert the largest FoV.
sim.wspsd   = PSD_Keck_ws20mas_vib26mas_rad2.fits


#Wavefront sensor information
include      = wfs_lgs_ttf.conf #LGS + TTF WFS
include      = powfs_shtwfs.conf
powfs.nwfs   = [4 1 1] #4 LGS, 1 TTF WFS
wfs.thetax   = [-0.355 -0.355 0.355 0.355 0.5 0.5] #WFS location on sky. To be scaled by powfs.astscale
wfs.thetay   = [-0.355 0.355 -0.355 0.355 0 0] 
powfs.astscale  = [15.2 0 0] 

powfs0_llt.focus= 280 #uplink quality
powfs.dsa    = [0 -2 -30] #subaperture size. 0 matches ground DM.
powfs.dtrat  = [1 1 1000] 
powfs.nwvl   = [1 1 1] #number of wavelength for each powfs
powfs.wvlwts = [1 1 1] #wavelength weights. 
powfs.wvl    = [0.589 1.25 0.8] #wavelength
powfs.pixtheta=[1.5 0.05 0.5] #pixel scale in arc seconds
powfs.pixpsa = [4 6 6] #number of pixels per subaperture dimension. negative means fov in arcsec.
powfs.rne    = [0.3 0.5 0.5]
powfs.mag    = [9 8 8]

powfs.atmthruput=[0.896 0.896 0.896]  #these numbers are current kapa number
powfs.telthruput=[0.36*0.9 0.32 0.03]  #these numbers are current kapa number

evl.wvl	    = [0.31 0.5 0.7 0.8 0.9 1.0 1.25 1.65 2.15]*1e-6 #For IR add 1.25 1.65 2.15
evl.psfsize	= [960, 512, 360, 300, 256, 240, 180, 128, 90] #proportional to wvl^(-6/5). make sure it is large enough for worse seeing.
evl.psfmean = 1 #save time averaged PSF 
evl.psfol   = 1 #save open loop PSF
evl.psf     = [1] #enable PSF for direction
evl.psfisim = 20 #frame to start computing PSF

powfs.astscale=[15.2 0 0] 


include=fit_oa.conf 
fit.fov=0 

include=evl_x.conf 
evl.wt=[1 0 0 0 0 0 0 0 0] 
evl.fov=20 
evl.psfmean=0 
#Implementation error based on kapa estimation
ncpa.surf=['r0=0.276; L0=5; slope=-2; seed=1; SURFEVL=[1]; SURFWFS=[0]'] #Simulate HO implementation error of 207.8 nm
ncpa.calib=0
sim.seeds   = [1 10 20 30]
sim.end     = 6020  #10 seconds
sim.dt      = 1/600
