#The keck aperture
aper.fnamp = "KECK.fits"
aper.d     = [11.0 2.4] #may contain one for [d] or two numbers for [d din]. d is
		      			#outer diameter. din is optimal inner hole diameter.
                      	# Note this is the size of the pupil image in fnamp.
                      	# Generated with paarti.utils.keck_utils.make_keck_pupil()
sim.htel   = 4145 ##height of telescope in meters from mean sea level. It is used to adjust powfs.hs for LGS. Updated 2026-07-31  
aper.segment=[1, 1.8, 0.005, 11, 1, 1.75, 0] #segment configuration. 4 numbers: 
	#1) type=1 for hexagon and 2 for circular , 
	#2) segment vertex to vertex diameter, 
	#3) segment edge gap, 
	#4) dout (circumscribed diameter)
	#5) din (optional, inscribed diameter)
	#6) f/# of primary mirror (optional; not telescope)
	#7) orientation in degrees (optional)
