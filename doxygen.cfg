# Doxygen configuration for MAOS, used by "make doc" (see Makefile.am).
#
# Only settings that differ from the doxygen defaults are listed, so that
# doxygen versions older or newer than the one this file was written with do
# not warn about unsupported tags. See "doxygen -g" or the doxygen manual for
# the other tags and their defaults. $(NAME) is replaced by the environment
# variable NAME, which "make doc" sets (DX_ENV in Makefile.am).
#
# To check which settings differ from the defaults of the installed doxygen,
# run "doxygen -x doxygen.cfg" (note that it expands $(NAME)).

PROJECT_NAME           = MAOS
PROJECT_BRIEF          = "Multithreaded Adaptive Optics Simulator"
PROJECT_LOGO           = $(SRCDIR)/docs/maos.png
PROJECT_ICON           = $(SRCDIR)/docs/maos.png
OUTPUT_DIRECTORY       = $(DOCDIR)
CREATE_SUBDIRS         = YES
ALLOW_UNICODE_NAMES    = Yes
ABBREVIATE_BRIEF       =
STRIP_FROM_PATH        = $(SRCDIR)
MULTILINE_CPP_IS_BRIEF = Yes
INHERIT_DOCS           = NO
OPTIMIZE_OUTPUT_FOR_C  = YES
EXTENSION_MAPPING      = cu=C++
TOC_INCLUDE_HEADINGS   = 5
IDL_PROPERTY_SUPPORT   = NO
SUBGROUPING            = NO
INLINE_SIMPLE_STRUCTS  = Yes
TYPEDEF_HIDES_STRUCT   = YES
EXTRACT_LOCAL_CLASSES  = NO
HIDE_IN_BODY_DOCS      = YES
CASE_SENSE_NAMES       = No
SHOW_INCLUDE_FILES     = NO
FORCE_LOCAL_INCLUDES   = Yes
INLINE_INFO            = NO
SORT_MEMBER_DOCS       = NO
MAX_INITIALIZER_LINES  = 5
SHOW_NAMESPACES        = NO
LAYOUT_FILE            = $(SRCDIR)/docs/doxygen.xml
QUIET                  = YES
WARN_IF_UNDOCUMENTED   = NO
INPUT                  = $(SRCDIR) \
                         $(UNITTEST_DOC)
FILE_PATTERNS          = *.c \
                         *.cu \
                         *.h \
                         *.conf \
                         *.md
RECURSIVE              = YES
EXCLUDE                = version.h \
                         $(SRCDIR)/CLAUDE.md \
                         $(UNITTEST_EXCLUDE)
EXCLUDE_SYMLINKS       = YES
EXCLUDE_PATTERNS       = */external/* \
                         */.claude/* \
                         */test/* \
                         */tools/* \
                         */mex/* \
                         */skyc/*
EXAMPLE_PATH           = $(SRCDIR)
EXAMPLE_PATTERNS       =
IMAGE_PATH             = $(SRCDIR)/docs
FILTER_SOURCE_FILES    = YES
USE_MDFILE_AS_MAINPAGE =  $(SRCDIR)/docs/main.md
VERBATIM_HEADERS       = NO
ALPHABETICAL_INDEX     = NO
GENERATE_HTML          = $(GENERATE_HTML)
HTML_EXTRA_STYLESHEET  = $(SRCDIR)/docs/doxygen_extra.css
HTML_DYNAMIC_SECTIONS  = YES
DOCSET_FEEDNAME        = "MAOS Documentation"
DOCSET_BUNDLE_ID       = org.tmt.maos
GENERATE_HTMLHELP      = $(GENERATE_HTMLHELP)
CHM_FILE               = ../$(PROJECT).chm
HHC_LOCATION           = $(HHC_PATH)
GENERATE_CHI           = $(GENERATE_CHI)
TOC_EXPAND             = YES
QHP_NAMESPACE          =
DISABLE_INDEX          = NO
USE_MATHJAX            = Yes
MATHJAX_RELPATH        = https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.1
MATHJAX_EXTENSIONS     = TeX/AMSmath \
                         TeX/AMSsymbols
GENERATE_LATEX         = $(GENERATE_LATEX)
MAKEINDEX_CMD_NAME     =
COMPACT_LATEX          = YES
PAPER_TYPE             = letter
EXTRA_PACKAGES         = amsmath \
                         amsfonts \
                         mathrsfs
USE_PDFLATEX           = $(GENERATE_PDF)
LATEX_BATCHMODE        = YES
LATEX_BIB_STYLE        = plain
GENERATE_RTF           = $(GENERATE_RTF)
COMPACT_RTF            = YES
GENERATE_MAN           = $(GENERATE_MAN)
GENERATE_XML           = $(GENERATE_XML)
MACRO_EXPANSION        = YES
PREDEFINED             = _DOXYGEN \
                         INLINE=inline \
                         USE_PTHREAD=1
EXPAND_AS_DEFINED      = EASY_TYPE \
                         EASY_DESTRUCTOR \
                         EASY_METHOD
GENERATE_TAGFILE       = $(DOCDIR)/$(PROJECT).tag
HIDE_UNDOC_RELATIONS   = NO
HAVE_DOT               = $(HAVE_DOT)
UML_LOOK               = Yes
TEMPLATE_RELATIONS     = YES
INCLUDE_GRAPH          = NO
INCLUDED_BY_GRAPH      = NO
INTERACTIVE_SVG        = Yes
DOT_GRAPH_MAX_NODES    = 1000
MAX_DOT_GRAPH_DEPTH    = 1
